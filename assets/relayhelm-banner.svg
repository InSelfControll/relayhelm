    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#b6c9e3" stroke-opacity=".045"/></pattern>
  </defs>
  <rect width="1280" height="400" rx="22" fill="url(#background)"/>
