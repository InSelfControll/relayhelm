<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">Relayhelm</title>
  <desc id="desc">Your models. Your context. Your helm. A gold navigation wheel on a midnight blue background.</desc>
